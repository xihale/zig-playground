name: Deploy

on:
  push:
    branches: ["main", "master"]
  # No pull_request trigger: jobs run on a self-hosted runner (our VPS) —
  # never execute fork PR code there.
  workflow_dispatch:
    inputs:
      rebuild_compilers:
        description: "Force rebuild compilers from source (ignore Release cache)"
        type: boolean
        default: false

permissions:
  contents: read

# Deploy = local rsync on the runner host; Caddy serves /srv/zig-playground.
# Prevent older slow jobs from overwriting a newer deploy (seen with
# ZlsWorker fix racing the prior 9m build).
concurrency:
  group: server-deploy
  cancel-in-progress: true

# Frontend deploys on every push.
# Compilers are REUSED from GitHub Release `compilers` by default.
# Source rebuild only when:
#   - workflow_dispatch with rebuild_compilers=true, or
#   - release is missing an id listed in versions.json
#
# Source builds use ziglang/zig@0.15.2 + patches/ (see versions.json).
# Do NOT clone zigtools/zig@wasm32-wasi with host 0.15.2 — Build API mismatch.
jobs:
  build:
    # Self-hosted runner on the zzy_hk VPS (zig-ci user, no sudo).
    runs-on: [self-hosted, zig-playground]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download compilers from Release (reuse)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers' }}
        run: |
          set -euo pipefail
          TAG="${COMPILERS_RELEASE}"
          mkdir -p public/compilers .zig-version-cache/release-download
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir .zig-version-cache/release-download --clobber \
              --pattern '*.tar.gz' 2>/dev/null; then
            for f in .zig-version-cache/release-download/*.tar.gz; do
              [ -e "$f" ] || continue
              id=$(basename "$f" .tar.gz)
              mkdir -p "public/compilers/$id"
              tar -xzf "$f" -C "public/compilers/$id"
              echo "extracted $id.tar.gz"
            done
          else
            echo "no archives on $TAG — trying fill script"
            node scripts/fill-compilers-from-release.mjs || true
          fi
          ls -la public/compilers || true

      - name: Detect whether a source compiler rebuild is needed
        id: need
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_compilers || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual workflow_dispatch rebuild_compilers" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MISSING=$(node --input-type=module -e '
            import { loadVersionsManifest } from "./scripts/versions-lib.mjs";
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            const m = loadVersionsManifest();
            const miss = m.versions.filter(v => !existsSync(join("public/compilers", v.id, "meta.json")));
            process.stdout.write(miss.map(v => v.id).join(" "));
          ')
          if [ -n "${MISSING// }" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing packages after release download: $MISSING" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          echo "reason=reuse Release compilers (all versions.json ids present)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install host Zig versions + binaryen (only if rebuilding)
        if: steps.need.outputs.rebuild == 'true'
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_compilers || false }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen jq xz-utils
          # Install every unique hostZig needed by versions that will rebuild.
          mapfile -t HOSTS < <(node --input-type=module -e '
            import { loadVersionsManifest } from "./scripts/versions-lib.mjs";
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            const force = process.env.FORCE === "true";
            const m = loadVersionsManifest();
            const need = m.versions.filter(v => force || !existsSync(join("public/compilers", v.id, "meta.json")));
            const hosts = [...new Set(need.map(v => v.hostZig).filter(Boolean))];
            process.stdout.write(hosts.join("\n"));
          ')
          echo "hostZig to install: ${HOSTS[*]:-(none)}"
          mkdir -p "$HOME/.local/share/zvm"
          INDEX=$(mktemp)
          curl -fsSL https://ziglang.org/download/index.json > "$INDEX"
          for HOST in "${HOSTS[@]}"; do
            [ -z "$HOST" ] && continue
            DEST="$HOME/.local/share/zvm/$HOST"
            if [ -x "$DEST/zig" ]; then
              echo "hostZig $HOST already at $DEST"
              continue
            fi
            echo "installing hostZig=$HOST"
            if [ "$HOST" = "master" ]; then
              URL=$(jq -r '.master["x86_64-linux"].tarball' "$INDEX")
            else
              URL=$(jq -r --arg v "$HOST" '.[$v]["x86_64-linux"].tarball // empty' "$INDEX")
            fi
            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "::error::no x86_64-linux tarball for hostZig=$HOST"
              exit 1
            fi
            TMP=$(mktemp -d)
            curl -fsSL "$URL" | tar -xJ -C "$TMP"
            INNER=$(find "$TMP" -maxdepth 1 -type d -name 'zig-*' | head -1)
            mkdir -p "$DEST"
            cp -a "$INNER"/. "$DEST"/
            "$DEST/zig" version
          done

      - name: Rebuild compilers from source
        if: steps.need.outputs.rebuild == 'true'
        id: zig_build
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "rebuild reason: ${{ steps.need.outputs.reason }}"
          # Builds every id that is still missing, or all stable when forced.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_compilers || false }}" = "true" ]; then
            node scripts/build-compilers.mjs --select all
          else
            node scripts/build-compilers.mjs --select all --skip-existing
          fi

      - name: Ensure every versions.json id is packaged
        run: |
          set -euo pipefail
          MISSING=$(node --input-type=module -e '
            import { loadVersionsManifest } from "./scripts/versions-lib.mjs";
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            const m = loadVersionsManifest();
            const miss = m.versions.filter(v => !existsSync(join("public/compilers", v.id, "meta.json")));
            process.stdout.write(miss.map(v => v.id).join(" "));
          ')
          if [ -z "${MISSING// }" ]; then
            echo "all versions.json ids present"
            ls public/compilers
            exit 0
          fi
          echo "::error::Missing compiler packages: $MISSING"
          echo "Upload compilers (per-version <id>.tar.gz), or Run workflow with rebuild_compilers=true."
          echo "Note: source builds need ziglang/zig@0.15.2 + patches/ (not zigtools/zig@wasm32-wasi)."
          exit 1

      - name: Require default compiler
        run: |
          DEFAULT=$(node -p "require('./versions.json').default")
          test -f "public/compilers/${DEFAULT}/meta.json"
          echo "compilers ready:"
          ls public/compilers

      - name: Frontend build + assemble multi-version dist
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          npm ci
          npm run build

      - name: Pre-gzip wasm (Caddy serves it precompressed, no runtime CPU)
        run: find dist -name "*.wasm" -exec gzip -k9 {} +

      - name: Publish to /srv/zig-playground
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          rsync -a --delete --delay-updates \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            dist/ /srv/zig-playground/
