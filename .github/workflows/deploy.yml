name: Deploy

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_compilers:
        description: "Force rebuild compilers from source (ignore Release cache)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Frontend deploys on every push.
# Compilers are REUSED from GitHub Release `compilers-latest` — not rebuilt every commit.
# Rebuild only when:
#   - release is missing an id listed in versions.json, or
#   - workflow_dispatch with rebuild_compilers=true, or
#   - compiler-related paths changed (versions.json / build.zig* / build scripts)
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect whether a source compiler rebuild is needed
        id: need
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_compilers || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual workflow_dispatch rebuild_compilers"
            exit 0
          fi

          # Paths that actually change wasm/zls packaging
          PATTERN='^(versions\.json|build\.zig|build\.zig\.zon|src/zls\.zig|scripts/(build-compilers|package-compiler|versions-lib|fill-compilers).*)$'
          CHANGED=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # first push / force: before is zeros
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git show --name-only --pretty='' HEAD || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" HEAD || true)
            fi
          fi

          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=compiler-related paths changed:"
            echo "$CHANGED" | grep -E "$PATTERN" || true
            exit 0
          fi

          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          echo "reason=reuse Release compilers (no compiler path changes)"

      - name: Download compilers from Release (reuse)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers-latest' }}
        run: |
          set -euo pipefail
          # Prefer full extract of compilers.tar.gz when present.
          TAG="${COMPILERS_RELEASE}"
          mkdir -p public/compilers .zig-version-cache/release-download
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir .zig-version-cache/release-download --clobber \
              --pattern 'compilers.tar.gz' 2>/dev/null; then
            tar -xzf .zig-version-cache/release-download/compilers.tar.gz -C public
            echo "extracted compilers.tar.gz from $TAG"
          else
            # Fallback: fill missing only (older release layouts)
            node scripts/fill-compilers-from-release.mjs || true
          fi
          ls -la public/compilers || true

      - name: Install Zig + binaryen (only if rebuilding)
        if: steps.need.outputs.rebuild == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install binaryen (only if rebuilding)
        if: steps.need.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Rebuild stable compilers from source
        if: steps.need.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          echo "rebuild reason: ${{ steps.need.outputs.reason }}"
          # Overwrite packaged trees for stable ids (release was only a starting point).
          node scripts/build-compilers.mjs --select stable

      - name: Ensure every versions.json id is packaged
        run: |
          set -euo pipefail
          MISSING=$(node --input-type=module -e '
            import { loadVersionsManifest } from "./scripts/versions-lib.mjs";
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            const m = loadVersionsManifest();
            const miss = m.versions.filter(v => !existsSync(join("public/compilers", v.id, "zig.wasm")));
            process.stdout.write(miss.map(v => v.id).join(" "));
          ')
          if [ -z "${MISSING// }" ]; then
            echo "all versions.json ids present — no zig build needed"
            exit 0
          fi
          echo "::error::Missing compiler packages: $MISSING"
          echo "Upload a compilers-latest release (compilers.tar.gz), or re-run Deploy with rebuild_compilers=true."
          exit 1

      - name: Require default compiler
        run: |
          DEFAULT=$(node -p "require('./versions.json').default")
          test -f "public/compilers/${DEFAULT}/zig.wasm"
          echo "compilers ready:"
          ls public/compilers

      - name: Frontend build + assemble multi-version dist
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
