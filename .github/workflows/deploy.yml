name: Deploy

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Compilers driven by versions.json (scripts/build-compilers.mjs).
# Binaries never enter git — only Pages / Release artifacts.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Plan (stable entries from versions.json)
        run: node scripts/build-compilers.mjs --select stable --dry-run

      - name: Build stable compilers (versions.json, no schedule)
        id: zig_build
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/build-compilers.mjs --select stable

      - name: Fill missing ids from release (e.g. master)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers-latest' }}
        run: |
          node scripts/fill-compilers-from-release.mjs --require-stable

      - name: Require default compiler
        run: |
          DEFAULT=$(node -p "require('./versions.json').default")
          test -f "public/compilers/${DEFAULT}/zig.wasm"

      - name: Frontend build + assemble multi-version dist
        env:
          # Custom domain zp.xihale.top serves at site root (base=/).
          # Override with repo var VITE_BASE only if you need a subpath again.
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
