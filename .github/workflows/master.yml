name: Master compiler (periodic)

# Rebuild versions.json entries with "schedule" (e.g. master ~every 3 days).
# Manual: Actions → Master compiler (periodic) → Run workflow

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Plan (scheduled entries from versions.json)
        run: node scripts/build-compilers.mjs --select scheduled --dry-run

      - name: Build scheduled compilers
        run: |
          set -euo pipefail
          node scripts/build-compilers.mjs --select scheduled

      - name: Fill non-scheduled ids from release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers-latest' }}
        run: |
          # Do not overwrite freshly built scheduled trees.
          node scripts/fill-compilers-from-release.mjs --require-all

      - name: Frontend build + assemble
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - uses: actions/deploy-pages@v4
