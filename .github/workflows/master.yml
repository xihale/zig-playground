name: Master compiler (periodic)

# Rebuild the `master` compiler tree about every 3 days and redeploy Pages.
# Binaries stay out of git (Pages artifact only).

on:
  schedule:
    # 00:00 UTC every 3 days
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Checkout zig master (wasm-capable tree)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ZIG_WASM_MASTER_REPO || vars.ZIG_WASM_REPO || 'zigtools/zig' }}
          ref: ${{ vars.ZIG_WASM_MASTER_REF || 'wasm32-wasi' }}
          path: zig-wasm-src

      - name: Link zig-wasm dependency
        run: |
          rm -rf "$GITHUB_WORKSPACE/../zig-wasm"
          ln -sfn "$GITHUB_WORKSPACE/zig-wasm-src" "$GITHUB_WORKSPACE/../zig-wasm"

      - name: Build + package master (+ stable mirror for full Pages tree)
        run: |
          set -euo pipefail
          zig build -Drelease -Dwasm-opt
          node scripts/package-compiler.mjs --id master --from zig-out
          # Full redeploy needs every listed id present under dist/compilers.
          node scripts/package-compiler.mjs --id 0.15.2 --from zig-out

      - name: Frontend build + assemble
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/zig-playground/' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - uses: actions/deploy-pages@v4
