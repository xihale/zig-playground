name: Master compiler (periodic)

# Rebuild versions.json entries with "schedule" (e.g. master ~every 3 days).
# Manual: Actions → Master compiler (periodic) → Run workflow
#
# Official Zig development lives on Codeberg (GitHub ziglang/zig master is a stub).
# hostZig=master (nightly) + versions.json build:"in-tree" builds zig.wasm inside
# the compiler source tree. ZLS lags master (zls#3208) → zlsFallbackId.

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve hostZig for scheduled ids
        id: host
        run: |
          set -euo pipefail
          HOST=$(node --input-type=module -e '
            import { loadVersionsManifest, selectVersions } from "./scripts/versions-lib.mjs";
            const m = loadVersionsManifest();
            const s = selectVersions(m, { select: "scheduled" });
            if (!s.length) { console.error("no scheduled versions"); process.exit(1); }
            process.stdout.write(s[0].hostZig || "master");
          ')
          echo "version=$HOST" >> "$GITHUB_OUTPUT"
          echo "hostZig=$HOST"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.host.outputs.version }}

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Fill non-scheduled ids from release (needed for zlsFallbackId)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers' }}
        run: |
          set -euo pipefail
          TAG="${COMPILERS_RELEASE}"
          mkdir -p public/compilers .zig-version-cache/release-download
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir .zig-version-cache/release-download --clobber \
              --pattern '*.tar.gz' 2>/dev/null; then
            for f in .zig-version-cache/release-download/*.tar.gz; do
              [ -e "$f" ] || continue
              id=$(basename "$f" .tar.gz)
              mkdir -p "public/compilers/$id"
              tar -xzf "$f" -C "public/compilers/$id"
              echo "extracted $id.tar.gz"
            done
          else
            node scripts/fill-compilers-from-release.mjs || true
          fi
          # Remove scheduled trees so we rebuild them fresh (keep fallback stables).
          node --input-type=module -e '
            import { loadVersionsManifest, selectVersions } from "./scripts/versions-lib.mjs";
            import { rmSync, existsSync } from "node:fs";
            import { join } from "node:path";
            for (const v of selectVersions(loadVersionsManifest(), { select: "scheduled" })) {
              const p = join("public/compilers", v.id);
              if (existsSync(p)) { rmSync(p, { recursive: true, force: true }); console.log("cleared", v.id); }
            }
          '
          ls -la public/compilers || true

      - name: Plan (scheduled entries from versions.json)
        run: node scripts/build-compilers.mjs --select scheduled --dry-run

      - name: Build scheduled compilers (official master, in-tree)
        id: zig_build
        run: |
          set -euo pipefail
          zig version
          node scripts/build-compilers.mjs --select scheduled

      - name: Ensure all versions.json ids packaged
        run: |
          set -euo pipefail
          MISSING=$(node --input-type=module -e '
            import { loadVersionsManifest } from "./scripts/versions-lib.mjs";
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            const m = loadVersionsManifest();
            const miss = m.versions.filter(v => !existsSync(join("public/compilers", v.id, "meta.json")));
            process.stdout.write(miss.map(v => v.id).join(" "));
          ')
          if [ -n "${MISSING// }" ]; then
            echo "::error::Missing: $MISSING"
            exit 1
          fi
          ls -laR public/compilers | head -40

      - name: Publish compilers Release (per rebuilt id)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMPILERS_RELEASE: ${{ vars.COMPILERS_RELEASE || 'compilers' }}
        run: |
          set -euo pipefail
          IDS=$(node --input-type=module -e '
            import { loadVersionsManifest, selectVersions } from "./scripts/versions-lib.mjs";
            process.stdout.write(selectVersions(loadVersionsManifest(), { select: "scheduled" }).map(v => v.id).join(" "));
          ')
          if gh release view "$COMPILERS_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for id in $IDS; do
              tar -C "public/compilers/$id" -czf "$id.tar.gz" .
              gh release upload "$COMPILERS_RELEASE" "$id.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
              echo "uploaded $id.tar.gz to $COMPILERS_RELEASE"
            done
          else
            FIRST=1
            for id in $IDS; do
              tar -C "public/compilers/$id" -czf "$id.tar.gz" .
              if [ "$FIRST" = "1" ]; then
                gh release create "$COMPILERS_RELEASE" "$id.tar.gz" --repo "$GITHUB_REPOSITORY" \
                  --title "Compiler assets (not in git)" \
                  --notes "Prebuilt per-version zig/zls wasm trees for Pages deploy."
                FIRST=0
              else
                gh release upload "$COMPILERS_RELEASE" "$id.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
              fi
              echo "uploaded $id.tar.gz to $COMPILERS_RELEASE"
            done
          fi

      - name: Frontend build + assemble
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - uses: actions/deploy-pages@v4
