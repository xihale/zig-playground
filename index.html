<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zig Playground</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main>
        <div id="split-pane">
            <section id="editor-pane">
                <div class="pane-toolbar">
                    <div class="pane-toolbar-left">
                        <select id="example-select" aria-label="Examples"></select>
                    </div>
                    <div class="pane-toolbar-actions">
                        <div class="share-menu" id="share-menu">
                            <button type="button" id="share-toggle" aria-haspopup="menu" aria-expanded="false" title="Share">Share</button>
                            <div class="share-dropdown" id="share-dropdown" role="menu" hidden>
                                <button type="button" role="menuitem" data-share="link">Link</button>
                                <button type="button" role="menuitem" data-share="iframe">iframe</button>
                            </div>
                        </div>
                        <button type="button" id="reset" title="Reset (Ctrl+R)">Reset</button>
                        <button type="button" id="run">Run</button>
                    </div>
                </div>
                <div id="editor"></div>
            </section>

            <div id="resize-bar" aria-label="Resize panes" role="separator"></div>

            <section id="preview-pane">
                <div class="pane-toolbar">
                    <div class="pane-toolbar-left">Output</div>
                    <div id="run-status" class="busy" title="status">
                        <span class="status-spinner" aria-hidden="true"></span>
                        <span id="status-text">loading</span>
                    </div>
                </div>
                <div id="output-container">
                    <div id="output-pad"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="/src/editor.ts" type="module"></script>
</body>
</html>
